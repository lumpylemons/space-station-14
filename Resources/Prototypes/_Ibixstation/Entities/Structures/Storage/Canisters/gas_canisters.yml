- type: entity
  parent: GasCanister
  id: HydrogenCanister
  name: hydrogen canister
  description: A canister that can contain any type of gas. This one is supposed to contain hydrogen. It can be attached to connector ports using a wrench.
  components:
    - type: Sprite
      layers:
      - state: yellow
      - state: paper
        visible: false
        map: [ "enum.PaperLabelVisuals.Layer" ]
      - state: integrity-unshaded-0
        map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
        shader: unshaded
        visible: false
      - state: mask-white
        map: [ "enum.MaxPressureVisualLayers.Base" ]
        visible: false
    - type: MaxPressureVisuals
      integrityMask: mask-white
    - type: GasCanister
      air:
        volume: 1500
        moles:
          Hydrogen: 2769.36
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTypeTrigger
          damageType: Blunt
          damage: 50
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            StorageCanisterBroken:
              min: 1
              max: 1
    - type: Lock
      locked: true

