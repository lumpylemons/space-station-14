- type: entity
  parent: GasCanister
  id: MethaneCanister
  name: methane canister
  description: A canister that can contain any type of gas. This one is supposed to contain methane. It can be attached to connector ports using a wrench.
  components:
    - type: Sprite
      layers:
      - state: yellow
      - state: paper
        visible: false
        map: [ "enum.PaperLabelVisuals.Layer" ]
      - state: integrity-unshaded-0
        map: [ "enum.MaxPressureVisualLayers.BaseUnshaded" ]
        shader: unshaded
        visible: false
      - state: mask-yellow
        map: [ "enum.MaxPressureVisualLayers.Base" ]
        visible: false
    - type: MaxPressureVisuals
      integrityMask: mask-yellow
    - type: GasCanister
      air:
        volume: 1500
        moles:
          Methane: 2769.36
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger: *DamageContainerStrong
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            StorageCanisterBroken:
              min: 1
              max: 1
    - type: Lock
      locked: true

- type: entity
  parent: GasCanisterBrokenBase
  id: MethaneCanisterBroken
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      state: yellow-1
